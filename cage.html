<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lock Tracker</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --blush:   #f5e8e4;
      --rose:    #c9847a;
      --plum:    #6b3a45;
      --ivory:   #fdf8f6;
      --stone:   #8a7570;
      --ink:     #2e1f22;
      --border:  #e8d8d3;
      --card-bg: #ffffff;
      --nav-h:   64px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--ivory);
      color: var(--ink);
      font-weight: 300;
    }

    /* ── Nav ─────────────────────────────────────────────────── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(253,248,246,0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      height: var(--nav-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
    }

    .nav-wordmark {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 400;
      letter-spacing: 0.08em;
      color: var(--plum);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      list-style: none;
    }

    .nav-links > li > a {
      display: flex;
      align-items: center;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--stone);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-links > li > a:hover { color: var(--plum); }

    /* ── Page Header ─────────────────────────────────────────── */
    .page-header {
      text-align: center;
      padding: 56px 24px 40px;
      border-bottom: 1px solid var(--border);
    }

    .page-header .eyebrow {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--rose);
      margin-bottom: 14px;
    }

    .page-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(34px, 5vw, 52px);
      font-weight: 400;
      color: var(--plum);
      line-height: 1.15;
    }

    .page-header h1 em { font-style: italic; }

    /* ── Layout ──────────────────────────────────────────────── */
    .content {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 32px 80px;
    }

    .section { margin-top: 48px; }
    .section:first-child { margin-top: 0; }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 400;
      color: var(--plum);
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    /* ── Cards ───────────────────────────────────────────────── */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 24px 20px;
    }

    .card.center { text-align: center; }

    .label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--stone);
      margin-bottom: 8px;
    }

    .subtle-note {
      font-size: 11px;
      font-style: italic;
      color: var(--stone);
      margin-bottom: 14px;
      letter-spacing: 0.04em;
    }

    .big {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      font-weight: 400;
      color: var(--plum);
      line-height: 1;
    }

    /* ── Status grid ─────────────────────────────────────────── */
    .status-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    /* Lock status — colour swaps based on state */
    #lockStatus[data-locked="yes"] { color: var(--plum); }
    #lockStatus[data-locked="no"]  { color: var(--stone); }

    /* ── Current panty card ──────────────────────────────────── */
    .current-panty-wrapper {
      max-width: 180px;
      margin: 0 auto 12px;
    }

    .current-panty-wrapper img {
      width: 100%;
      display: block;
      border: 1px solid var(--border);
    }

    .item-name {
      font-family: 'Playfair Display', serif;
      font-size: 14px;
      color: var(--ink);
      margin-top: 4px;
    }

    /* ── Stat rows ───────────────────────────────────────────── */
    .stat-row {
      display: flex;
      gap: 20px;
    }

    .stat-block {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-top: 3px solid var(--rose);
      padding: 20px;
      flex: 1;
      text-align: center;
    }

    .stat-value {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      color: var(--plum);
    }

    .stat-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--stone);
      margin-top: 6px;
    }

    /* ── Tables ──────────────────────────────────────────────── */
    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
    }

    th, td {
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--stone);
      background: var(--blush);
    }

    td { color: var(--ink); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--ivory); }

    .table-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    /* ── Footer ──────────────────────────────────────────────── */
    footer {
      border-top: 1px solid var(--border);
      padding: 24px 32px;
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--stone);
    }

    /* ── Responsive ──────────────────────────────────────────── */
    @media (max-width: 600px) {
      nav { padding: 0 16px; }
      .content { padding: 24px 16px 60px; }
      .status-grid { grid-template-columns: 1fr; }
      .stat-row { flex-direction: column; }
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-wordmark" href="https://www.panty-drawer.com">The Drawer</a>
  <ul class="nav-links">
    <li><a href="https://www.panty-drawer.com">&#8592; Back to Drawer</a></li>
  </ul>
</nav>

<header class="page-header">
  <p class="eyebrow">Session Tracking</p>
  <h1>Lock <em>Tracker</em></h1>
</header>

<div class="content">

  <!-- Status -->
  <div class="section">
    <div class="section-title">Status</div>
    <div class="status-grid">
      <div class="card center">
        <div class="label">Are you locked?</div>
        <div id="lockStatus" class="big">Checking...</div>
      </div>
      <div class="card center">
        <div class="label">Current Session</div>
        <div id="timer" class="big" style="font-size:28px; letter-spacing:0.05em;">--:--:--</div>
      </div>
    </div>

    <div class="card center" style="margin-top: 20px;">
      <div class="label">Currently Wearing</div>
      <div class="subtle-note">For photo verification</div>
      <div id="currentPanty"></div>
    </div>
  </div>

  <!-- This Week -->
  <div class="section">
    <div class="section-title">This Week</div>
    <div class="stat-row" id="weekStats"></div>
  </div>

  <!-- This Month -->
  <div class="section">
    <div class="section-title">This Month</div>
    <div class="stat-row" id="monthStats"></div>
  </div>

  <!-- Top 10 -->
  <div class="section">
    <div class="section-title">Top 10 Longest Sessions</div>
    <div class="table-card">
      <table id="topTable">
        <thead><tr><th>Date</th><th>Duration</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- Monthly Summary -->
  <div class="section">
    <div class="section-title">Monthly Summary</div>
    <div class="table-card">
      <table id="monthlyTable">
        <thead><tr><th>Month</th><th>Sessions</th><th>Total Time</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

</div>

<footer>
  &copy; The Drawer &nbsp;&middot;&nbsp; Lock Tracker
</footer>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const client = createClient(
  'https://rkocfrsaeeyxgfdxeiqz.supabase.co',
  'sb_publishable_yp7myP1S5wmYLQrgwNWxhg_IfZHdeZj'
);

function formatTime(seconds) {
  seconds = Math.floor(seconds);
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  return `${h}h ${m}m ${s}s`;
}

function formatClock(seconds) {
  seconds = Math.floor(seconds);
  const h = String(Math.floor(seconds / 3600)).padStart(2,'0');
  const m = String(Math.floor((seconds % 3600)/60)).padStart(2,'0');
  const s = String(seconds % 60).padStart(2,'0');
  return `${h}:${m}:${s}`;
}

function statBlocks(sessions, totalSeconds) {
  return `
    <div class="stat-block">
      <div class="stat-value">${sessions}</div>
      <div class="stat-label">Sessions</div>
    </div>
    <div class="stat-block">
      <div class="stat-value" style="font-size:20px;">${formatTime(totalSeconds)}</div>
      <div class="stat-label">Total Time</div>
    </div>`;
}

async function loadStatus() {
  const { data } = await client
    .from('focus_sessions')
    .select('*')
    .is('end_time', null)
    .order('start_time', { ascending: false })
    .limit(1);

  const el = document.getElementById('lockStatus');
  if (data.length > 0) {
    el.innerText = 'Yes';
    el.dataset.locked = 'yes';
    const started = new Date(data[0].start_time);
    setInterval(() => {
      const seconds = (new Date() - started) / 1000;
      document.getElementById('timer').innerText = formatClock(seconds);
    }, 1000);
  } else {
    el.innerText = 'No';
    el.dataset.locked = 'no';
    document.getElementById('timer').innerText = '--:--:--';
  }
}

async function loadWeekStats() {
  const startOfWeek = new Date();
  startOfWeek.setDate(startOfWeek.getDate() - startOfWeek.getDay());
  startOfWeek.setHours(0,0,0,0);

  const { data } = await client
    .from('focus_sessions')
    .select('*')
    .gte('start_time', startOfWeek.toISOString())
    .not('end_time','is',null);

  let totalSeconds = 0;
  data.forEach(row => {
    totalSeconds += (new Date(row.end_time) - new Date(row.start_time)) / 1000;
  });

  document.getElementById('weekStats').innerHTML = statBlocks(data.length, totalSeconds);
}

async function loadMonthStats() {
  const startOfMonth = new Date();
  startOfMonth.setDate(1);
  startOfMonth.setHours(0,0,0,0);

  const { data } = await client
    .from('focus_sessions')
    .select('*')
    .gte('start_time', startOfMonth.toISOString())
    .not('end_time','is',null);

  let totalSeconds = 0;
  data.forEach(row => {
    totalSeconds += (new Date(row.end_time) - new Date(row.start_time)) / 1000;
  });

  document.getElementById('monthStats').innerHTML = statBlocks(data.length, totalSeconds);
}

async function loadTop10() {
  const { data } = await client
    .from('focus_sessions')
    .select('*')
    .not('end_time','is',null);

  const sessions = data.map(row => ({
    date: new Date(row.start_time).toISOString().split('T')[0],
    duration: (new Date(row.end_time) - new Date(row.start_time)) / 1000
  }));

  sessions.sort((a,b) => b.duration - a.duration);

  const tbody = document.querySelector('#topTable tbody');
  sessions.slice(0,10).forEach(s => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${s.date}</td><td>${formatTime(s.duration)}</td>`;
    tbody.appendChild(tr);
  });
}

async function loadMonthlySummary() {
  const { data } = await client
    .from('focus_sessions')
    .select('*')
    .not('end_time','is',null);

  const months = {};
  data.forEach(row => {
    const start = new Date(row.start_time);
    const key = `${start.getFullYear()}-${String(start.getMonth()+1).padStart(2,'0')}`;
    const duration = (new Date(row.end_time) - start) / 1000;
    if (!months[key]) months[key] = { sessions: 0, total: 0 };
    months[key].sessions++;
    months[key].total += duration;
  });

  const tbody = document.querySelector('#monthlyTable tbody');
  Object.keys(months).sort().reverse().forEach(month => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${month}</td>
      <td>${months[month].sessions}</td>
      <td>${formatTime(months[month].total)}</td>`;
    tbody.appendChild(tr);
  });
}

async function loadCurrentPanty() {
  const { data, error } = await client
    .from('wear_history')
    .select('worn_at, created_at, panties ( id, image_url, name )')
    .order('worn_at', { ascending: false })
    .order('created_at', { ascending: false })
    .limit(1);

  if (error) { console.error(error); return; }

  if (data && data.length > 0) {
    const panty = data[0].panties;
    document.getElementById('currentPanty').innerHTML = `
      <div class="current-panty-wrapper">
        <img src="${panty.image_url}" alt="${panty.name}" />
      </div>
      <div class="item-name">${panty.name}</div>`;
  } else {
    document.getElementById('currentPanty').textContent = 'None found';
  }
}

loadStatus();
loadCurrentPanty();
loadWeekStats();
loadMonthStats();
loadTop10();
loadMonthlySummary();
</script>
</body>
</html>
